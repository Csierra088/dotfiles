# ─── Cyberpunk prompt ─────────────────────────────────────────────────────────
# Línea 1: ╔ dir  branch status  runtime
# Línea 2: ╚❯

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╔](bold #7a04eb) $directory$git_branch$git_status$nodejs$python$rust$golang$docker_context$cmd_duration$fill$time
[╚](bold #7a04eb)[❯❯](bold #ff2a6d) """

add_newline = true

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "dimmed #7a04eb"
format = "[$time]($style)"

[directory]
style = "bold #05d9e8"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold #ff2a6d"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold #7a04eb"
format = "on [$symbol$branch(:$remote_branch)]($style) "
truncation_length = 20

[git_status]
style = "bold #ff9a00"
format = "([$all_status$ahead_behind]($style) )"
ahead   = "⇡${count}"
behind  = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged   = "+${count}"
untracked = "?${count}"
deleted  = "✘${count}"
conflicted = "~${count}"

[nodejs]
symbol = "⬡ "
style = "bold #00ff9f"
format = "[$symbol$version]($style) "
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "bold #05d9e8"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold #ff9a00"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold #05d9e8"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "bold #05d9e8"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "dimmed #7a04eb"
format = " [$duration]($style)"

[character]
success_symbol = "[❯](bold #00ff9f)"
error_symbol   = "[❯](bold #ff2a6d)"
vimcmd_symbol  = "[❮](bold #7a04eb)"

[username]
show_always = false

[hostname]
ssh_only = true
style = "bold #ff2a6d"
format = "[$hostname]($style) "
