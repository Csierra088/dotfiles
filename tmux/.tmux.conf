# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Core ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g status-interval 5

# ─── Cyberpunk palette ────────────────────────────────────────────────────────
# Neon pink   #ff2a6d  |  Neon cyan  #05d9e8
# Deep purple #0d0221  |  Mid purple #1a1a2e
# Electric    #7a04eb  |  Neon green #00ff9f
# Dim         #3a3a6a  |  Lavender   #d1d1e9

# ─── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0d0221"

# Izquierda: sesión activa
set -g status-left-length 40
set -g status-left "#[bg=#ff2a6d,fg=#0d0221,bold]  #{session_name} #[bg=#1a1a2e,fg=#ff2a6d]#[bg=#1a1a2e] "

# Derecha: prefix indicator + hora
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=#7a04eb fg=#0d0221 bold]  PREFIX #[bg=#0d0221 fg=#7a04eb],}#[fg=#3a3a6a]  #[fg=#05d9e8]%H#[fg=#ff2a6d]:#[fg=#05d9e8]%M #[fg=#3a3a6a] #[fg=#d1d1e9 bold]%d %b "

# ─── Ventanas ─────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format         "#[bg=#1a1a2e,fg=#3a3a6a] #I #[fg=#6a6a9a]#W  "
set -g window-status-current-format "#[bg=#0d0221,fg=#1a1a2e]#[bg=#1a1a2e,fg=#05d9e8,bold] #I #[fg=#d1d1e9]#W #[fg=#05d9e8]⬡ #[bg=#0d0221,fg=#1a1a2e]"

# ─── Paneles ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#3a3a6a"
set -g pane-active-border-style "fg=#7a04eb"
set -g display-panes-colour "#3a3a6a"
set -g display-panes-active-colour "#ff2a6d"

# ─── Mensajes ─────────────────────────────────────────────────────────────────
set -g message-style "bg=#1a1a2e,fg=#05d9e8,bold"
set -g message-command-style "bg=#1a1a2e,fg=#ff2a6d"

# ─── Copy mode ────────────────────────────────────────────────────────────────
set -g mode-style "bg=#7a04eb,fg=#d1d1e9"

# ─── Splits ───────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Navegación vim ───────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ─── Utils ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "#[fg=#00ff9f bold] ⬡ tmux recargado"
bind X confirm-before -p "#[fg=#ff2a6d]Kill '#{session_name}'? (y/n)" "kill-session"

# Copy mode vim → pbcopy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
